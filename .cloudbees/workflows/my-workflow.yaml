apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
jobs:
  build:
    steps:
      - id: build-image
        kind: build
        name: Build Go Application
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "Building Go application"
          echo "hello world" > hello.txt
          # Simulate building a Go app
          # Build your Go application or run your build scripts here
          echo "Build successful"

  deploy-staging:
    environment: staging
    steps:
      - id: deploy-step
        kind: deploy
        name: Deploy Go Application
        uses: docker://alpine:3.17
        shell: sh
        run: |
          echo "Deploying Go application to staging"
          echo "hello world" # You can add actual deployment commands here
          # Simulate deployment (e.g., copy files, push Docker image, etc.)
          echo "Deployed successfully to staging"

  register-deployment:
    if: ${{ cloudbees.scm.branch == 'main' }}
    needs:
      - deploy-staging
    steps:
      - name: register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: "6b804472-550d-4a65-8f09-87d8ff9257cd"
          target-environment: "staging"
